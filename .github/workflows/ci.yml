name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # selftest 不需要模型，也不读任何数据；只装最小依赖
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy janome zhconv

      - name: Pipeline selftest (13 checks, no data required)
        run: python pipeline/pipeline.py selftest

      - name: Empty-subtitle gate selftest (4 cases)
        run: python scripts/empty_check.py --selftest

      # 回归门禁在「无数据」下必须全过（数据依赖用例自动跳过）。
      # 这条能防止有人把「缺数据」写回成「判失败」——那会让协作者 clone 下来一片红。
      - name: Regression gate (must pass without any data)
        run: python scripts/test_regressions.py

      # 错字表门禁：无语料时应报 SKIP 并 exit 0
      - name: Errata gate (skips without corpus)
        run: python scripts/errata_audit.py --test

      # 自带的样例必须能通过自己的检查器（否则发出去就是个坏例子）
      - name: Shipped example passes our own checker
        run: python scripts/check.py examples

      - name: Byte-compile everything
        run: python -m compileall -q pipeline scripts

  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed data / media / internal ledgers
        run: |
          fail=0
          # ⚠️ 别写 `grep ... | head -5`：head 永远退出 0，那个 if 会恒为真。
          # 用变量接住再判空。
          hit=$(git ls-files | grep -Ei '\.(mp3|flac|wav|m4a|onnx|gguf|bin|pt)$' | head -5 || true)
          if [ -n "$hit" ]; then
            echo "$hit"; echo "::error::音频/模型文件被提交了"; fail=1
          fi
          hit=$(git ls-files | grep -E '^(RJ[0-9]|kikoerusubtitle|runs|regset|knowledge|tmp|internal|data|assets)' | head -5 || true)
          if [ -n "$hit" ]; then
            echo "$hit"; echo "::error::数据或内部台账被提交了（应被 .gitignore 挡住）"; fail=1
          fi
          hit=$(git ls-files '*.lrc' | grep -v '^examples/' | head -5 || true)
          if [ -n "$hit" ]; then
            echo "$hit"; echo "::error::成品字幕被提交了（examples/ 下的合成样例除外）"; fail=1
          fi
          [ "$fail" = "0" ] && echo "OK"
          exit $fail
